[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_URL is set in the Netlify UI (Site configuration > Environment
  # variables), e.g. https://gpradar-api.onrender.com. It is public, not a secret.

# Content-Security-Policy is NOT set here: it needs the API host from
# VITE_API_URL and the hash of the inline theme script, and netlify.toml cannot
# read environment variables. build/csp.ts writes it to dist/_headers at build
# time; Netlify merges that file with the headers below. The generated policy:
#   default-src 'self'; script-src 'self' 'sha256-<theme script>';
#   style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self';
#   connect-src 'self' <origin of VITE_API_URL>; frame-ancestors 'none';
#   base-uri 'self'; form-action 'none'

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
